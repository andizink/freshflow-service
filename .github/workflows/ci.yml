name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.8.x"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python pin 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python pin 3.12
      - run: uv sync --all-groups
      - run: uv run mypy

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python pin 3.12
      - run: uv sync --all-groups
      - run: >
          uv run pytest -m "not e2e and not smoke"
          --cov=app --cov-branch --cov-fail-under=90

  e2e:
    name: e2e
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python pin 3.12
      - run: uv sync --all-groups
      - run: uv run pytest -m e2e

  docker:
    name: docker
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        run: docker build -t freshflow-service:smoke-test .

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python pin 3.12
      - run: uv sync --all-groups

      - name: Container smoke test (build/run/ingest/query/inspect, cleans up itself)
        run: uv run pytest -m smoke -q
